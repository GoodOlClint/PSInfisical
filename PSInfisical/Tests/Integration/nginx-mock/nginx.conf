# nginx.conf — Mock HTTP server for 429 retry integration testing.
# Returns 429 (Too Many Requests) for the first 2 requests to /api/test,
# then 200 on the 3rd. State is tracked via files on a tmpfs volume.
# The /reset endpoint resets the counter for test isolation.
# The /health endpoint always returns 200 for Docker health checks.

events {
    worker_connections 16;
}

http {
    # Counter state directory on tmpfs (shared volume)
    lua_shared_dict counter 1m;

    init_by_lua_block {
        ngx.shared.counter:set("hits", 0)
    }

    server {
        listen 80;

        # Health check — always 200
        location /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # Reset counter — call before each test
        location /reset {
            content_by_lua_block {
                ngx.shared.counter:set("hits", 0)
                ngx.status = 200
                ngx.header["Content-Type"] = "application/json"
                ngx.say('{"reset":true}')
            }
        }

        # Mock API endpoint — 429 twice, then 200
        location /api/ {
            content_by_lua_block {
                local hits = ngx.shared.counter:incr("hits", 1, 0)
                if hits <= 2 then
                    ngx.status = 429
                    ngx.header["Content-Type"] = "application/json"
                    ngx.header["Retry-After"] = "1"
                    ngx.say('{"message":"Too Many Requests","statusCode":429}')
                else
                    ngx.status = 200
                    ngx.header["Content-Type"] = "application/json"
                    ngx.say('{"secret":{"secretKey":"MOCK","secretValue":"mock-value","version":1}}')
                end
            }
        }
    }
}
