# docker-compose.yml
# Integration test environment for PSInfisical.
# Stands up a self-hosted Infisical instance with PostgreSQL, Redis,
# and an nginx mock for 429 retry testing.
# Usage: docker compose up -d (from this directory)

services:
  db:
    image: postgres:14-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Ephemeral — no named volumes. Data is lost on `docker compose down`.
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - infisical-test

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /data
    networks:
      - infisical-test

  infisical:
    image: infisical/infisical:latest-postgres
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - NODE_ENV=production
    ports:
      - "${INFISICAL_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/status"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    networks:
      - infisical-test

  # Mock HTTP server for 429 retry testing.
  # Uses OpenResty (nginx + Lua) to return 429 twice then 200.
  # Call /reset before each test to zero the counter.
  mock-429:
    image: openresty/openresty:alpine
    volumes:
      - ./nginx-mock/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
    ports:
      - "${MOCK_429_PORT:-8429}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - infisical-test

networks:
  infisical-test:
    driver: bridge

