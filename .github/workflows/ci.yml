name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }}, PS ${{ matrix.powershell }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            powershell: '5.1'
            shell: powershell
          - os: windows-latest
            powershell: '7'
            shell: pwsh
          - os: ubuntu-latest
            powershell: '7'
            shell: pwsh
          - os: macos-latest
            powershell: '7'
            shell: pwsh

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name InvokeBuild -Scope CurrentUser -Force
          Install-Module -Name Pester -MinimumVersion 5.0 -Scope CurrentUser -Force
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          Install-Module -Name Microsoft.PowerShell.SecretManagement -Scope CurrentUser -Force

      - name: Run build pipeline (Clean, Build, Test, Analyze)
        run: Invoke-Build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-ps${{ matrix.powershell }}
          path: output/TestResults.xml

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name InvokeBuild -Scope CurrentUser -Force
          Install-Module -Name Pester -MinimumVersion 5.0 -Scope CurrentUser -Force
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          Install-Module -Name Microsoft.PowerShell.SecretManagement -Scope CurrentUser -Force

      - name: Run integration tests
        run: Invoke-Build Test-Integration

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-integration
          path: output/TestResults-Integration.xml
