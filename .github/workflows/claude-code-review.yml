name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: 'dependabot[bot]'
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for PSInfisical, a PowerShell module for
            the Infisical secrets management API.

            Focus areas:
            1. **Secret handling** — All secret values must use SecureString
               in cmdlet parameters and be zero-allocated with
               Marshal.ZeroFreeGlobalAllocUnicode after use. Never log secret
               values in WriteVerbose/WriteDebug.
            2. **Cmdlet conventions** — Approved verbs only, PascalCase
               parameters, camelCase locals, OTBS brace style, comment-based
               help on all public functions, explicit [Parameter] attributes.
               Must pass PSScriptAnalyzer with zero violations.
            3. **API correctness** — Parameter names and paths must match the
               Infisical API docs. Pay attention to workspace/environment/project
               scoping — these are common sources of 400 errors.
            4. **Auth** — Machine identity tokens vs service tokens vs user
               tokens have different capabilities. Flag any cmdlet that assumes
               the wrong auth type.
            5. **Tests** — New cmdlets should have Pester parameter-validation
               tests at minimum. Check Tests/Unit/ and Tests/Integration/.
            6. **Security** — No hardcoded credentials, no secrets in logs or
               error messages, no plain-text secret storage.

            Provide inline comments for specific issues and a summary comment
            for general observations. Skip nitpicks unless they indicate a
            real problem.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
